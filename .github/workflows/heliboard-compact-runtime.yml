name: HeliBoard Compact runtime repair
on:
  push:
    branches:
      - fix/heliboard-compact-runtime-20261024
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reproduce-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download exact reported broken APK
        uses: actions/download-artifact@v4
        with:
          name: HeliBoard-inline-voice-debug
          run-id: 40098360205
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: broken-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce startup crash and capture real Logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: python3 heliboard-inline-voice/tests/runtime_probe.py --apk-dir broken-apk --package helium314.keyboard.compactdebug --output runtime-baseline --expect-startup-crash
      - name: Preserve baseline crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-baseline-runtime-evidence
          path: runtime-baseline/
          if-no-files-found: error

  build-and-test-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Checkout unchanged pinned HeliBoard 4.3-beta1
        run: |
          git init heliboard-source
          git -C heliboard-source remote add origin https://github.com/HeliBorg/HeliBoard.git
          git -C heliboard-source fetch --depth 1 origin e97acdbe7ad16ef06d89d71d35ed1096e6d69f4c
          git -C heliboard-source checkout --detach FETCH_HEAD
      - name: Apply compact runtime repair
        run: python3 heliboard-inline-voice/apply_overlay.py heliboard-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned SDK and NDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run project unit tests and compile new Debug APK
        working-directory: heliboard-source
        run: |
          chmod +x gradlew
          # AGP 9 only enables debug unit tests by default. Restore the project's
          # existing runTests variant explicitly, without changing AGP/Kotlin.
          ./gradlew -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false testRunTestsUnitTest assembleDebug --stacktrace
      - name: Preserve test reports and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-compact-unit-test-reports
          path: |
            heliboard-source/app/build/reports/tests/
            heliboard-source/app/build/test-results/
            heliboard-inline-voice/evidence/
          if-no-files-found: warn
      - name: Download previous stable APK for side-by-side test
        uses: actions/download-artifact@v4
        with:
          name: HeliBoard-inline-voice-debug
          run-id: 40093348555
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: stable-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual fixed APK on Android 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: python3 heliboard-inline-voice/tests/runtime_probe.py --apk-dir heliboard-source/app/build/outputs/apk/debug --package helium314.keyboard.compactfixdebug --output runtime-fixed --stable-apk-dir stable-apk
      - name: Preserve real runtime logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-compact-fixed-runtime-evidence
          path: runtime-fixed/
          if-no-files-found: warn
      - name: Name verified APK and record exact source and binary provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          report = json.loads(Path('runtime-fixed/report.json').read_text())
          assert report['status'] == 'passed'
          apks = list(Path('heliboard-source/app/build/outputs/apk/debug').glob('*.apk'))
          assert len(apks) == 1
          sha = os.environ['GITHUB_SHA']
          out = Path('verified-apk'); out.mkdir()
          target = out / ('HeliBoard_Compact_Fix_' + sha[:8] + '.apk')
          shutil.copy2(apks[0], target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          assert digest == report['apk_sha256']
          (out / 'build-info.json').write_text(json.dumps({
              'repair_commit': sha,
              'upstream_commit': 'e97acdbe7ad16ef06d89d71d35ed1096e6d69f4c',
              'application_id': report['package'], 'apk_sha256': digest,
              'runtime': report, 'run_id': os.environ['GITHUB_RUN_ID']
          }, indent=2))
          PY
      - name: Publish only the new runtime-tested APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-Compact-Fix-debug
          path: verified-apk/
          if-no-files-found: error
