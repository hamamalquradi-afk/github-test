name: Phase 7C Security Probe

on:
  push:
    branches: ["phase-7c-security-remediation"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit stable Next 16 candidates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          for v in 16.3.0 16.3.3 16.3.6 16.3.8; do
            echo "=== CANDIDATE $v ==="
            dir="/tmp/next-$v"
            rm -rf "$dir"
            mkdir -p "$dir"
            cp "$ROOT/package.json" "$dir/package.json"
            cd "$dir"
            npm install --package-lock-only --ignore-scripts --save-exact "next@$v" >/tmp/install-$v.log 2>&1
            npm ls next postcss --package-lock-only || true
            npm audit --omit=dev --json >"/tmp/audit-$v.json" || true
            node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,vulnerabilities:Object.fromEntries(Object.entries(a.vulnerabilities||{}).map(([k,x])=>[k,{severity:x.severity,range:x.range,fixAvailable:x.fixAvailable,via:(x.via||[]).map(v=>typeof v==="string"?v:{title:v.title,url:v.url,severity:v.severity,range:v.range})}]))},null,2));' "/tmp/audit-$v.json"
            cd "$ROOT"
          done
