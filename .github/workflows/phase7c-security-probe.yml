name: Phase 7C Security Probe

on:
  push:
    branches: ["phase-7c-security-remediation"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Candidate version metadata
        shell: bash
        run: |
          set -euo pipefail
          for v in 16.0.0 16.0.1 16.0.7 16.1.0 16.1.6 16.2.0 16.2.11 16.3.0 16.3.3 16.3.6 16.3.8; do
            echo "=== NEXT $v ==="
            npm view next@$v version dependencies.postcss peerDependencies.react peerDependencies.react-dom engines.node --json
          done
