name: Install Phase 7B Branding Assets

on:
  push:
    branches: ["phase-7b-hamnova-customer-management"]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-7b-hamnova-customer-management

      - name: Install approved HAMNOVA assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/branding

          curl --fail --location --silent --show-error \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/ed617700-f63b-48cb-afc5-09cd1a842756.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDNhN2Q2MzY3OTQ4NWJmZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk3MjU5OH0.gcyLrD85tHT66X57bsW99PtJBanORTdhZTS_quaH29o' \
            --output public/branding/hamnova-icon.png

          curl --fail --location --silent --show-error \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/c2acff4e-5e08-40c6-82ba-ae9cfa564932.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzg4NjJlZTQ5NGE3OGI2ZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk3OTQyOH0.IZTI8nCc1FI1CpOEYIIIczmNZPbdwl8Ju5w3g139j9U' \
            --output public/branding/hamnova-logo.png

          echo "54db1a5e254ff80804e1c77a514fafd36e9041d7825bf047adc4b9c46b46d33b  public/branding/hamnova-icon.png" | sha256sum -c -
          echo "e4b52d460567909f2f4ac16dccb1dbd978e0df8e8a53d9e15f365dabdc7a3e73  public/branding/hamnova-logo.png" | sha256sum -c -

          rm -f .github/workflows/phase7b-brand-assets.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 7B: add approved HAMNOVA brand assets"
          git push origin HEAD:phase-7b-hamnova-customer-management
