name: HeliBoard inline voice APK
on:
  push:
    branches:
      - heliboard-inline-voice-v1
    paths:
      - heliboard-inline-voice/**
      - .github/workflows/heliboard-inline-voice.yml
      - .github/workflows/heliboard-theme-verify.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-built:
    if: startsWith(github.event.head_commit.message, '[verify-built]')
    uses: ./.github/workflows/heliboard-theme-verify.yml
  build-debug:
    # A verification-only commit consumes a previously built APK after proving
    # its application source is unchanged; see heliboard-theme-verify.yml.
    if: ${{ !startsWith(github.event.head_commit.message, '[verify-built]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned official HeliBoard source
        shell: bash
        run: |
          git init heliboard-source
          git -C heliboard-source remote add origin https://github.com/HeliBorg/HeliBoard.git
          git -C heliboard-source fetch --depth 1 origin e97acdbe7ad16ef06d89d71d35ed1096e6d69f4c
          git -C heliboard-source checkout --detach FETCH_HEAD
      - name: Apply pinned Compact overlay and offline theme gallery
        run: python3 heliboard-inline-voice/apply_overlay.py heliboard-source
      - name: Validate patched layout and install identifiers
        run: python3 heliboard-inline-voice/validate_overlay.py heliboard-source
      - name: Run focused host fixture regressions
        run: |
          python3 -m unittest discover -s heliboard-inline-voice/themes -p test_prepare_emulator_fixture.py -v
          python3 -m unittest discover -s heliboard-inline-voice/branding/tests -p 'test_*.py' -v
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK and NDK required by pinned source
        run: |
          echo "Using SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-unknown}}"
          SDKMGR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108"
          # SDK publishes API 37 as android-37.0, while AGP requests android-37.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Restore permanent KEYNOVA signing identity from repository secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYNOVA_SIGNING_KEYSTORE_B64 }}
          KEYNOVA_SIGNING_PASSWORD: ${{ secrets.KEYNOVA_SIGNING_PASSWORD }}
          KEYNOVA_SIGNING_KEY_ALIAS: ${{ secrets.KEYNOVA_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Missing KEYNOVA_SIGNING_KEYSTORE_B64 secret}"
          : "${KEYNOVA_SIGNING_PASSWORD:?Missing KEYNOVA_SIGNING_PASSWORD secret}"
          : "${KEYNOVA_SIGNING_KEY_ALIAS:?Missing KEYNOVA_SIGNING_KEY_ALIAS secret}"
          # Exported credential text files contain terminal newlines; GitHub secrets can retain them.
          # Normalize only boundary whitespace, never echo passwords or private-key material.
          KEYNOVA_SIGNING_PASSWORD="$(python3 -c 'import os,sys;sys.stdout.write(os.environ["KEYNOVA_SIGNING_PASSWORD"].strip())')"
          KEYNOVA_SIGNING_KEY_ALIAS="$(python3 -c 'import os,sys;sys.stdout.write(os.environ["KEYNOVA_SIGNING_KEY_ALIAS"].strip())')"
          export KEYNOVA_SIGNING_PASSWORD KEYNOVA_SIGNING_KEY_ALIAS
          if [ "${#KEYNOVA_SIGNING_PASSWORD}" -lt 32 ]; then
            echo "::error title=Invalid signing password secret::Expected a password of at least 32 characters; check KEYNOVA_SIGNING_PASSWORD."
            exit 1
          fi
          if [ "$KEYNOVA_SIGNING_KEY_ALIAS" != "keynova-smart" ]; then
            echo "::error title=Invalid signing alias::KEYNOVA_SIGNING_KEY_ALIAS must match the backed-up key alias."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/keynova-signing"
          KEYNOVA_DEBUG_KEYSTORE="$RUNNER_TEMP/keynova-signing/keynova-smart.p12"
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | base64 --decode > "$KEYNOVA_DEBUG_KEYSTORE"; then
            echo "::error title=Invalid signing keystore secret::KEYNOVA_SIGNING_KEYSTORE_B64 is not valid Base64."
            exit 1
          fi
          if [ ! -s "$KEYNOVA_DEBUG_KEYSTORE" ]; then
            echo "::error title=Empty signing keystore::Decoded KEYNOVA_SIGNING_KEYSTORE_B64 is empty."
            exit 1
          fi
          export KEYNOVA_DEBUG_KEYSTORE
          if ! keytool -list -storetype PKCS12 -keystore "$KEYNOVA_DEBUG_KEYSTORE" -storepass:env KEYNOVA_SIGNING_PASSWORD >/dev/null 2>&1; then
            echo "::error title=Signing password or key mismatch::PKCS12 keystore cannot be opened with KEYNOVA_SIGNING_PASSWORD. Recheck the secret against your backed-up file."
            exit 1
          fi
          if ! keytool -list -storetype PKCS12 -keystore "$KEYNOVA_DEBUG_KEYSTORE" -storepass:env KEYNOVA_SIGNING_PASSWORD -alias "$KEYNOVA_SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Signing alias not found::Keystore opened, but KEYNOVA_SIGNING_KEY_ALIAS is not present."
            exit 1
          fi
          EXPECTED_CERT_SHA256=2274da5280a2acc2456835e8d56de5d37887f6e85d5b3df2acb088428d1d6270
          ACTUAL_CERT_SHA256="$(keytool -exportcert -storetype PKCS12 -keystore "$KEYNOVA_DEBUG_KEYSTORE" -storepass:env KEYNOVA_SIGNING_PASSWORD -alias "$KEYNOVA_SIGNING_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error title=Unexpected signing certificate::Configured key does not match the permanent KEYNOVA certificate backed up by the owner."
            exit 1
          fi
          echo "KEYNOVA_DEBUG_KEYSTORE=$KEYNOVA_DEBUG_KEYSTORE" >> "$GITHUB_ENV"
          echo "PASS: permanent signing key, password, alias and SHA-256 fingerprint validated."
      - name: Restore pinned Gradle dependencies
        id: pinned_gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: heliboard-pinned-deps-e97acdbe-v1
      - name: Build experimental debug APK
        env:
          KEYNOVA_SIGNING_PASSWORD: ${{ secrets.KEYNOVA_SIGNING_PASSWORD }}
          KEYNOVA_SIGNING_KEY_ALIAS: ${{ secrets.KEYNOVA_SIGNING_KEY_ALIAS }}
        working-directory: heliboard-source
        run: |
          chmod +x gradlew
          run_build() {
            set +e
            ./gradlew "$@" --stacktrace --max-workers=2 2>&1 | tee /tmp/keynova-gradle-build.log
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -ne 0 ]; then
              python3 ../heliboard-inline-voice/branding/report_build_failure.py /tmp/keynova-gradle-build.log
              return "$result"
            fi
          }
          run_build assembleDebug
          run_build assembleThemes
          ./gradlew --stop
      - name: Verify KEYNOVA SMART APK identity in both variants
        shell: bash
        run: |
          set -euo pipefail
          for variant in debug themes; do
            APK="heliboard-source/app/build/outputs/apk/$variant/HeliBoard_4.3-beta1-$variant.apk"
            "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" > "/tmp/keynova-$variant-badging.txt"
            python3 - "$variant" <<'PYCODE'
          import pathlib, sys
          variant = sys.argv[1]
          text = pathlib.Path(f"/tmp/keynova-{variant}-badging.txt").read_text()
          expected = "helium314.keyboard.compactdebug" if variant == "debug" else "helium314.keyboard.compactthemesdebug"
          assert f"package: name='{expected}'" in text, text
          assert "application-label:'KEYNOVA SMART'" in text, text
          assert "application-label-ar:'كينوفا سمارت'" in text, text
          assert "application-icon-" in text, text
          print(f"PASS: {variant} APK package, English/Arabic identity and icon")
          PYCODE
          done
      - name: Retain pinned Gradle dependencies
        if: steps.pinned_gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: heliboard-pinned-deps-e97acdbe-v1
      - name: Use Java 21 for Robolectric SDK 36 unit tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run available debug JVM unit tests
        id: unit_tests
        continue-on-error: true
        working-directory: heliboard-source
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Reproduce failures on unmodified pinned upstream
        if: steps.unit_tests.outcome == 'failure'
        id: baseline_tests
        continue-on-error: true
        shell: bash
        run: |
          git -C heliboard-source worktree add --detach ../heliboard-baseline HEAD
          cd heliboard-baseline
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Reject regressions against pinned upstream
        if: steps.unit_tests.outcome == 'failure'
        run: |
          python3 heliboard-inline-voice/compare_test_results.py \
            heliboard-baseline/app/build/test-results/testDebugUnitTest \
            heliboard-source/app/build/test-results/testDebugUnitTest
      - name: Require all focused application regression tests
        run: |
          python3 - <<'PYCODE'
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('heliboard-source/app/build/test-results/testDebugUnitTest')
          cases = [c for p in root.glob('TEST-*.xml') for c in ET.parse(p).getroot().findall('testcase')]
          for name, minimum in [('BrandingTest', 2), ('VoiceInputControllerTest', 10), ('ThemeGalleryTest', 10), ('ModifierLifecycleTest', 4)]:
              selected = [c for c in cases if c.get('classname', '').endswith('.' + name)]
              assert len(selected) >= minimum, f'{name} tests missing: {len(selected)}'
              assert all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in selected), f'{name} failed/skipped'
              print(f'PASS: {name}: {len(selected)} tests')
          PYCODE
      - name: Upload JVM test result reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-unit-test-reports
          path: |
            heliboard-source/app/build/test-results/testDebugUnitTest/**
            heliboard-source/app/build/reports/tests/testDebugUnitTest/**
            heliboard-baseline/app/build/test-results/testDebugUnitTest/**
      - name: Verify APK signature and record checksum
        env:
          KEYNOVA_SIGNING_PASSWORD: ${{ secrets.KEYNOVA_SIGNING_PASSWORD }}
          KEYNOVA_SIGNING_KEY_ALIAS: ${{ secrets.KEYNOVA_SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_CERT="$(keytool -exportcert -storetype PKCS12 -keystore "$KEYNOVA_DEBUG_KEYSTORE" -storepass:env KEYNOVA_SIGNING_PASSWORD -alias "$KEYNOVA_SIGNING_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)"
          for variant in debug themes; do
            APK="heliboard-source/app/build/outputs/apk/$variant/HeliBoard_4.3-beta1-$variant.apk"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" > "/tmp/keynova-$variant-signature.txt"
            python3 - "$EXPECTED_CERT" "/tmp/keynova-$variant-signature.txt" <<'PY'
          import pathlib, re, sys
          expected, path = sys.argv[1:]
          content = pathlib.Path(path).read_text()
          found = re.findall(r'(?im)^.*certificate SHA-256 digest:\s*([0-9a-f]{64})\s*$', content)
          if not found or len(set(x.lower() for x in found)) != 1 or found[0].lower() != expected.lower():
              raise SystemExit("APK signing certificate mismatch or ambiguous certificate metadata")
          print("PASS: APK signature and certificate match permanent signing identity")
          PY
            sha256sum "$APK" > "${APK}.sha256"
          done
      - name: Publish built APK (if successful)
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-inline-voice-debug
          path: heliboard-source/app/build/outputs/apk/debug/*.apk*
          if-no-files-found: error
      - name: Retrieve previous working test APK for install-compatibility test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/heliboard-previous
          if ! gh run download 40093348555 --repo "${{ github.repository }}" --name HeliBoard-inline-voice-debug --dir /tmp/heliboard-previous; then
            echo "Previous artifact unavailable: side-by-side install test will be skipped."
          fi
      - name: Publish install-alongside Themes APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-Compact-Themes-side-by-side
          path: heliboard-source/app/build/outputs/apk/themes/*.apk*
          if-no-files-found: error
      - name: Release completed build daemons before starting Android
        working-directory: heliboard-source
        run: ./gradlew --stop
      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Smoke test launch and keyboard service on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            bash heliboard-inline-voice/smoke-test.sh heliboard-source/app/build/outputs/apk/debug/HeliBoard_4.3-beta1-debug.apk /tmp/heliboard-previous/HeliBoard_4.3-beta1-debug.apk
            bash heliboard-inline-voice/themes/emulator-test.sh
            adb install -r heliboard-source/app/build/outputs/apk/themes/HeliBoard_4.3-beta1-themes.apk
            adb shell pm path helium314.keyboard.compactdebug
            adb shell pm path helium314.keyboard.compactthemesdebug
            adb shell ime enable helium314.keyboard.compactthemesdebug/helium314.keyboard.latin.LatinIME
            adb shell ime set helium314.keyboard.compactthemesdebug/helium314.keyboard.latin.LatinIME
            bash heliboard-inline-voice/themes/emulator-test.sh helium314.keyboard.compactthemesdebug
      - name: Upload theme gallery emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-theme-gallery-verification
          path: heliboard-inline-voice/test-results/gallery/**
          if-no-files-found: ignore
      - name: Upload Android emulator runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-emulator-runtime-log
          path: heliboard-inline-voice/test-results/emulator-logcat.txt
          if-no-files-found: ignore
      - name: Preserve build failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-build-reports
          path: heliboard-source/**/build/reports/**
          if-no-files-found: ignore
