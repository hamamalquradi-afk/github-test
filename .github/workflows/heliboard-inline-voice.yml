name: HeliBoard inline voice APK
on:
  push:
    branches:
      - heliboard-inline-voice-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-debug:
    # A verification-only commit consumes a previously built APK after proving
    # its application source is unchanged; see heliboard-theme-verify.yml.
    if: ${{ !startsWith(github.event.head_commit.message, '[verify-built]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned official HeliBoard source
        shell: bash
        run: |
          git init heliboard-source
          git -C heliboard-source remote add origin https://github.com/HeliBorg/HeliBoard.git
          git -C heliboard-source fetch --depth 1 origin e97acdbe7ad16ef06d89d71d35ed1096e6d69f4c
          git -C heliboard-source checkout --detach FETCH_HEAD
      - name: Apply pinned Compact overlay and offline theme gallery
        run: python3 heliboard-inline-voice/apply_overlay.py heliboard-source
      - name: Validate patched layout and install identifiers
        run: python3 heliboard-inline-voice/validate_overlay.py heliboard-source
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK and NDK required by pinned source
        run: |
          echo "Using SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-unknown}}"
          SDKMGR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108"
          # SDK publishes API 37 as android-37.0, while AGP requests android-37.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Retain Compact debug signing identity for subsequent builds
        id: compact_signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: heliboard-compact-debug-signing-v1
      - name: Build experimental debug APK
        working-directory: heliboard-source
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleThemes --stacktrace
      - name: Use Java 21 for Robolectric SDK 36 unit tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run available debug JVM unit tests
        id: unit_tests
        continue-on-error: true
        working-directory: heliboard-source
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Reproduce failures on unmodified pinned upstream
        if: steps.unit_tests.outcome == 'failure'
        id: baseline_tests
        continue-on-error: true
        shell: bash
        run: |
          git -C heliboard-source worktree add --detach ../heliboard-baseline HEAD
          cd heliboard-baseline
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Reject regressions against pinned upstream
        if: steps.unit_tests.outcome == 'failure'
        run: |
          python3 heliboard-inline-voice/compare_test_results.py \
            heliboard-baseline/app/build/test-results/testDebugUnitTest \
            heliboard-source/app/build/test-results/testDebugUnitTest
      - name: Upload JVM test result reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-unit-test-reports
          path: |
            heliboard-source/app/build/test-results/testDebugUnitTest/**
            heliboard-source/app/build/reports/tests/testDebugUnitTest/**
            heliboard-baseline/app/build/test-results/testDebugUnitTest/**
      - name: Verify APK signature and record checksum
        run: |
          APK=heliboard-source/app/build/outputs/apk/debug/HeliBoard_4.3-beta1-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "${APK}.sha256"
          APK=heliboard-source/app/build/outputs/apk/themes/HeliBoard_4.3-beta1-themes.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "${APK}.sha256"
      - name: Save Compact debug signing identity before emulator tests
        if: steps.compact_signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: heliboard-compact-debug-signing-v1
      - name: Publish built APK (if successful)
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-inline-voice-debug
          path: heliboard-source/app/build/outputs/apk/debug/*.apk*
          if-no-files-found: error
      - name: Retrieve previous working test APK for install-compatibility test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/heliboard-previous
          if ! gh run download 40093348555 --repo "${{ github.repository }}" --name HeliBoard-inline-voice-debug --dir /tmp/heliboard-previous; then
            echo "Previous artifact unavailable: side-by-side install test will be skipped."
          fi
      - name: Publish install-alongside Themes APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-Compact-Themes-side-by-side
          path: heliboard-source/app/build/outputs/apk/themes/*.apk*
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Smoke test launch and keyboard service on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            bash heliboard-inline-voice/smoke-test.sh heliboard-source/app/build/outputs/apk/debug/HeliBoard_4.3-beta1-debug.apk /tmp/heliboard-previous/HeliBoard_4.3-beta1-debug.apk
            bash heliboard-inline-voice/themes/emulator-test.sh
            adb install -r heliboard-source/app/build/outputs/apk/themes/HeliBoard_4.3-beta1-themes.apk
            adb shell pm path helium314.keyboard.compactdebug
            adb shell pm path helium314.keyboard.compactthemesdebug
            adb shell ime enable helium314.keyboard.compactthemesdebug/helium314.keyboard.latin.LatinIME
            adb shell ime set helium314.keyboard.compactthemesdebug/helium314.keyboard.latin.LatinIME
            bash heliboard-inline-voice/themes/emulator-test.sh helium314.keyboard.compactthemesdebug
      - name: Upload theme gallery emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-theme-gallery-verification
          path: heliboard-inline-voice/test-results/gallery/**
          if-no-files-found: ignore
      - name: Upload Android emulator runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-emulator-runtime-log
          path: heliboard-inline-voice/test-results/emulator-logcat.txt
          if-no-files-found: ignore
      - name: Preserve build failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-build-reports
          path: heliboard-source/**/build/reports/**
          if-no-files-found: ignore
