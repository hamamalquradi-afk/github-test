name: Verify built HeliBoard Themes APKs
on:
  # One push creates one workflow run. The build workflow routes host-only
  # [verify-built] commits here as a reusable job instead of a second push run.
  workflow_call:
    inputs:
      source_run_id:
        type: string
        required: false
        default: '40249783089'
      source_commit:
        type: string
        required: false
        default: 46e8221f057379c2753160664a33c4abf302857f
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run that built the unchanged application source
        required: true
        default: '40249783089'
      source_commit:
        description: Exact application source commit for that run
        required: true
        default: 46e8221f057379c2753160664a33c4abf302857f

permissions:
  contents: read
  actions: read

jobs:
  verify-built:
    if: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[verify-built]')) && !contains(github.event.head_commit.message, '[diagnostics]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_RUN: ${{ inputs.source_run_id || '40249783089' }}
      SOURCE_COMMIT: ${{ inputs.source_commit || '46e8221f057379c2753160664a33c4abf302857f' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run focused emulator fixture regression tests
        run: |
          python3 -m unittest discover -s heliboard-inline-voice/themes -p test_prepare_emulator_fixture.py -v
          python3 -m unittest discover -s heliboard-inline-voice/branding/tests -p 'test_*.py' -v
      - name: Prove built APK provenance and unchanged application source
        id: provenance
        shell: bash
        run: |
          test "$(gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_COMMIT"
          test "$(gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN" --jq .status)" = "completed"
          echo "source_conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN" --jq .conclusion)" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          python3 - <<'PY'
          import os, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['SOURCE_COMMIT'], 'HEAD'], text=True).splitlines()
          allowed = {'.github/workflows/heliboard-inline-voice.yml', '.github/workflows/heliboard-theme-verify.yml', 'heliboard-inline-voice/themes/emulator-test.sh', 'heliboard-inline-voice/themes/prepare-emulator-fixture.py', 'heliboard-inline-voice/themes/test_prepare_emulator_fixture.py', 'heliboard-inline-voice/branding/verify-emulator.sh', 'heliboard-inline-voice/branding/tests/test_ci_diagnostics.py'}
          unexpected = [p for p in changed if p not in allowed and not p.endswith('.md')]
          if unexpected:
              raise SystemExit('Application source changed; rebuild is required: ' + repr(unexpected))
          print('PASS: APK application source unchanged; only verification configuration differs')
          PY
      - name: Retrieve existing APKs and complete JVM reports
        run: |
          mkdir -p verified
          gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > verified/artifacts.json
          python3 - <<'PY'
          import json, os, pathlib, subprocess, zipfile
          artifacts = json.loads(pathlib.Path('verified/artifacts.json').read_text())['artifacts']
          for name, folder in [('HeliBoard-inline-voice-debug', 'debug'), ('HeliBoard-Compact-Themes-side-by-side', 'themes'), ('HeliBoard-unit-test-reports', 'unit')]:
              artifact = max((a for a in artifacts if a['name'] == name and not a['expired']), key=lambda a: a['created_at'])
              assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_COMMIT']
              archive = pathlib.Path('verified') / (folder + '.zip')
              with archive.open('wb') as output:
                  subprocess.run(['gh', 'api', 'repos/${{ github.repository }}/actions/artifacts/' + str(artifact['id']) + '/zip'], stdout=output, check=True)
              with zipfile.ZipFile(archive) as zipped:
                  assert zipped.testzip() is None
                  zipped.extractall(pathlib.Path('verified') / folder)
              print('Verified artifact source:', name, artifact['id'])
          PY
          python3 heliboard-inline-voice/compare_test_results.py verified/unit/heliboard-baseline/app/build/test-results/testDebugUnitTest verified/unit/heliboard-source/app/build/test-results/testDebugUnitTest
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('verified/unit/heliboard-source/app/build/test-results/testDebugUnitTest')
          cases = [case for path in root.glob('TEST-*.xml') for case in ET.parse(path).getroot().findall('testcase')]
          failed = [case for case in cases if case.find('failure') is not None or case.find('error') is not None]
          skipped = [case for case in cases if case.find('skipped') is not None]
          print(f'::notice title=JVM results::{len(cases)} executed records; {len(cases)-len(failed)-len(skipped)} passed; {len(failed)} failed; {len(skipped)} skipped. Compare gate retains reproduced upstream failures.')
          for name, minimum in [('BrandingTest', 2), ('VoiceInputControllerTest', 10), ('ThemeGalleryTest', 10)]:
              selected = [case for case in cases if case.get('classname', '').endswith('.' + name)]
              assert len(selected) >= minimum, f'{name} tests missing: {len(selected)}'
              assert all(case not in failed and case not in skipped for case in selected), f'{name} failed/skipped'
              print(f'::notice title=Verified regression class::{name}: {len(selected)} passed')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Recheck immutable APK checksums and signatures
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          for variant in debug themes; do
            APK="verified/$variant/HeliBoard_4.3-beta1-$variant.apk"
            EXPECTED="$(cut -d ' ' -f 1 "$APK.sha256")"
            test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$EXPECTED"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            echo "::notice title=Verified APK SHA-256::$variant $EXPECTED"
          done
      - name: Compare signing identity with the previous Compact checkpoint
        # Historical compatibility is separate from the required current APK
        # signature/checksum gate above; disclose failures without hiding smoke tests.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error title=Historical signing comparison::Comparison failed at line $LINENO with exit code $?; historical update compatibility is unverified."' ERR
          PREVIOUS_SHA="$(gh api "repos/${{ github.repository }}/actions/runs/40225011537" --jq .head_sha)"
          echo "::notice title=Previous checkpoint identity::$PREVIOUS_SHA"
          test "$PREVIOUS_SHA" = '455d937ac1c3e4a258eda078753b50db7e5d66a2'
          if gh run download 40225011537 --repo "${{ github.repository }}" --name HeliBoard-inline-voice-debug --dir /tmp/keynova-previous-identity; then
            export APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            python3 - <<'PY'
          import pathlib, os, re, subprocess
          def certificate(path):
              result = subprocess.run([os.environ['APKSIGNER'], 'verify', '--print-certs', str(path)], text=True, capture_output=True)
              output = result.stdout
              if result.returncode:
                  print('::error title=Historical certificate verification::' + str(path) + ': ' + (result.stderr or result.stdout).replace('%', '%25').replace('\n', '%0A')[:2400])
                  raise RuntimeError('Historical certificate could not be verified')
              found = set(re.findall(r'certificate SHA-256 digest:\s*([a-fA-F0-9]{64})', output))
              if len(found) != 1:
                  print('::error title=Certificate metadata::' + output.replace('%', '%25').replace('\n', '%0A')[:2600])
                  raise RuntimeError('Cannot establish one signing certificate')
              return next(iter(found)).lower()
          previous = certificate(pathlib.Path('/tmp/keynova-previous-identity/HeliBoard_4.3-beta1-debug.apk'))
          current = certificate(pathlib.Path('verified/debug/HeliBoard_4.3-beta1-debug.apk'))
          if previous == current:
              print(f'::notice title=Signing compatibility::Compact checkpoint and current APK share certificate SHA-256 {current}')
          else:
              print('::warning title=Signing compatibility::Certificate differs from the previous Compact checkpoint. Keep the installed keyboard and its data; a compatible in-place update requires the original private keystore.')
          PY
          else
            echo '::warning title=Signing compatibility::Previous Compact APK unavailable; historical certificate compatibility remains unverified.'
          fi
      - name: Inspect bounded non-secret signing-cache diagnostics
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repository = os.environ['GITHUB_REPOSITORY']
          source_run = os.environ['SOURCE_RUN']
          def sanitize(text):
              text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
              return re.sub(r'https?://[^\s]+', '[URL redacted]', text).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          # New gh versions reject ANSI-containing job logs even when captured.
          # Opt in only when supported, then sanitize before emitting notices.
          help_text = subprocess.run(['gh', 'api', '--help'], capture_output=True, text=True, check=True).stdout
          log_flags = ['--allow-escape-sequences'] if '--allow-escape-sequences' in help_text else []
          def api(path):
              flags = log_flags if path.endswith('/logs') else []
              result = subprocess.run(['gh', 'api', path, *flags], capture_output=True)
              if result.returncode:
                  detail = result.stderr.decode(errors='replace')
                  print('::error title=Signing-cache API diagnostic::' + sanitize(detail)[:1800])
                  raise SystemExit(result.returncode)
              return result.stdout
          jobs = json.loads(api(f'repos/{repository}/actions/runs/{source_run}/jobs'))['jobs']
          print('::notice title=Source job names::' + sanitize(', '.join(job['name'] for job in jobs)))
          selected = [job for job in jobs if job['name'] == 'build-debug']
          if not selected and len(jobs) == 1:
              selected = jobs
          assert len(selected) == 1, 'Cannot identify one source build job'
          log = api(f"repos/{repository}/actions/jobs/{selected[0]['id']}/logs").decode(errors='replace')
          lines = log.splitlines()
          indices = [i for i, line in enumerate(lines) if 'Cache save failed' in line or 'Path Validation Error' in line]
          emitted = set()
          for i in indices:
              for line in lines[max(0, i-6):i+4]:
                  if line in emitted or not any(term in line.lower() for term in ['cache', 'path', 'keystore', 'error', 'failed']):
                      continue
                  if any(term in line.lower() for term in ['authorization', 'token', 'password', 'sig=']):
                      continue
                  emitted.add(line)
                  if len(emitted) <= 10:
                      print('::notice title=Signing-cache diagnostic::' + sanitize(line))
          if not indices:
              print('::notice title=Signing-cache diagnostic::No cache save error found in source job logs.')
          caches = json.loads(api(f'repos/{repository}/actions/caches?key=heliboard-compact-debug-signing-v1'))['actions_caches']
          metadata = [{key: cache.get(key) for key in ['key', 'ref', 'size_in_bytes']} for cache in caches]
          print('::notice title=Signing-cache metadata::' + sanitize(json.dumps(metadata) if metadata else 'No retained cache entry for this signing key'))
          PY
      - name: Enable KVM
        if: steps.provenance.outputs.source_conclusion != 'success'
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Complete restart, typing, shortcuts, RTL and install-alongside checks
        if: steps.provenance.outputs.source_conclusion != 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash heliboard-inline-voice/branding/verify-emulator.sh
      - name: Upload final emulator reports and screenshots
        if: always() && steps.provenance.outputs.source_conclusion != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-final-theme-gallery-verification
          path: |
            heliboard-inline-voice/test-results/gallery/**
            heliboard-inline-voice/test-results/emulator-logcat.txt
            heliboard-inline-voice/test-results/launch-commands.txt
          if-no-files-found: error

  signing-cache-diagnostics:
    if: startsWith(github.event.head_commit.message, '[verify-built] [diagnostics]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '40236691889'
    steps:
      - name: Inspect bounded non-secret signing-cache diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repository = os.environ['GITHUB_REPOSITORY']
          source_run = os.environ['SOURCE_RUN']
          def sanitize(text):
              text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
              return re.sub(r'https?://[^\s]+', '[URL redacted]', text).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          # New gh versions reject ANSI-containing job logs even when captured.
          # Opt in only when supported, then sanitize before emitting notices.
          help_text = subprocess.run(['gh', 'api', '--help'], capture_output=True, text=True, check=True).stdout
          log_flags = ['--allow-escape-sequences'] if '--allow-escape-sequences' in help_text else []
          def api(path):
              flags = log_flags if path.endswith('/logs') else []
              result = subprocess.run(['gh', 'api', path, *flags], capture_output=True)
              if result.returncode:
                  detail = result.stderr.decode(errors='replace')
                  print('::error title=Signing-cache API diagnostic::' + sanitize(detail)[:1800])
                  raise SystemExit(result.returncode)
              return result.stdout
          jobs = json.loads(api(f'repos/{repository}/actions/runs/{source_run}/jobs'))['jobs']
          print('::notice title=Source job names::' + sanitize(', '.join(job['name'] for job in jobs)))
          selected = [job for job in jobs if job['name'] == 'build-debug']
          if not selected and len(jobs) == 1:
              selected = jobs
          assert len(selected) == 1, 'Cannot identify one source build job'
          log = api(f"repos/{repository}/actions/jobs/{selected[0]['id']}/logs").decode(errors='replace')
          lines = log.splitlines()
          indices = [i for i, line in enumerate(lines) if 'Cache save failed' in line or 'Path Validation Error' in line]
          emitted = set()
          for i in indices:
              for line in lines[max(0, i-6):i+4]:
                  if line in emitted or not any(term in line.lower() for term in ['cache', 'path', 'keystore', 'error', 'failed']):
                      continue
                  if any(term in line.lower() for term in ['authorization', 'token', 'password', 'sig=']):
                      continue
                  emitted.add(line)
                  if len(emitted) <= 10:
                      print('::notice title=Signing-cache diagnostic::' + sanitize(line))
          if not indices:
              print('::notice title=Signing-cache diagnostic::No cache save error found in source job logs.')
          caches = json.loads(api(f'repos/{repository}/actions/caches?key=heliboard-compact-debug-signing-v1'))['actions_caches']
          metadata = [{key: cache.get(key) for key in ['key', 'ref', 'size_in_bytes']} for cache in caches]
          print('::notice title=Signing-cache metadata::' + sanitize(json.dumps(metadata) if metadata else 'No retained cache entry for this signing key'))
          PY
